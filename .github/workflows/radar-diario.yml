name: Radar Diário

on:
  # Disparo agendado agora é feito externamente (cron-job.org chamando a API
  # do GitHub via workflow_dispatch), porque o `schedule:` nativo do GitHub
  # estava falhando silenciosamente na maioria dos disparos (mesmo motivo
  # que já levou o Radar H1 a trocar para este mesmo padrão).
  workflow_dispatch: {}

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: radar-diario
      cancel-in-progress: true

    steps:
      - name: Confira o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Dependências de instalação
        run: pip install yfinance requests pandas

      - name: Executar script de radar
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_CHANNEL_ID_CLIENTES: ${{ secrets.TELEGRAM_CHANNEL_ID_CLIENTES }}
          TELEGRAM_THREAD_ID_CLIENTES_D1: ${{ secrets.TELEGRAM_THREAD_ID_CLIENTES_D1 }}
        run: python radar.py
