name: 🚀 Executar Radar S1 US PDV

on:
  # Disparo agendado agora é feito externamente (cron-job.org chamando a API
  # do GitHub via workflow_dispatch), porque o `schedule:` nativo do GitHub
  # estava falhando silenciosamente e chegou a desativar este workflow por
  # inatividade — mesmo motivo que já levou o Radar H1 e o Radar Diário a
  # trocar para este mesmo padrão.
  workflow_dispatch: {}

jobs:
  run-radar-s1:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: radar-s1
      cancel-in-progress: true
    env:
      TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID_S1:   ${{ secrets.TELEGRAM_CHAT_ID_S1 }}
      TELEGRAM_THREAD_ID_S1: ${{ secrets.TELEGRAM_THREAD_ID_S1 }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas yfinance

      - name: Run radar S1 script
        run: python radar_s1.py
